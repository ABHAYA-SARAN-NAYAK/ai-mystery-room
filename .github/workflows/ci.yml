name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test
        env:
          NODE_ENV: test
          GEMINI_MOCK: "true"

      - name: Build shared package
        run: npm run build --workspace=@mystery/shared

      - name: Build server
        run: npm run build:server

      - name: Build client
        run: npm run build:client
